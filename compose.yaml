services:
  challenge:
    build:
      context: ../challenge
    environment:
      STORAGE_ENDPOINT: minio:9000
      STORAGE_BUCKET: challenge-attachments
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_SECURE: "false"
      STORAGE_AUTO_CREATE_BUCKET: "false"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - silo
        - healthcheck
        - ready
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: docker.io/pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/challenge-attachments &&
        mc anonymous set none local/challenge-attachments
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

volumes:
  minio_data:
